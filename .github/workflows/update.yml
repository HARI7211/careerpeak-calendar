name: update-calendar
on:
  schedule:
    # 정시(0분)는 GitHub 예약 실행이 밀리거나 빠지기 쉬워 피한다. 두 번째는 첫 실행이 빠졌을 때를 위한 예비(바뀐 것이 없으면 커밋하지 않음).
    - cron: "23 21 * * *"  # 매일 06:23 KST
    - cron: "47 22 * * *"  # 매일 07:47 KST (예비)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch.py
      - name: fetch_sci (정출연 밖 과기 기관 28곳)
        continue-on-error: true
        run: python scripts/fetch_sci.py
      - name: commit
        run: |
          git config user.name "careerpeak-calendar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "calendar: $(TZ=Asia/Seoul date +%F) 갱신"
          git push
